SPDX-FileCopyrightText = "2026 Hakoniwa"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "Cargo.toml"
SPDX-FileCopyrightText = "2026 Hakoniwa"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = [
  "crates/efude-core/Cargo.toml",
  "crates/efude-input/Cargo.toml",
  "crates/efude-stroke/Cargo.toml",
  "crates/efude-brush/Cargo.toml",
  "crates/efude-canvas/Cargo.toml",
  "crates/efude-gpu/Cargo.toml",
  "crates/efude-io/Cargo.toml",
  "crates/efude-comic/Cargo.toml",
  "crates/efude/Cargo.toml",
  "crates/efude/README.md",
]
